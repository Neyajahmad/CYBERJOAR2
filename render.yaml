# Render configuration for backend deployment

services:
  - type: web
    name: urban-growth-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
